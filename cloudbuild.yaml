substitutions:
  _SERVICE_NAME: spring-boot-dev
  _REGION: europe-west1
  _CLUSTER_NAME: int-be
  _CLUSTER_ZONE: europe-west1

steps:
  # 1. Build image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}', '.']

  # 2. Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}']

  # 3. Get credentials from GKE
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'container',
        'clusters',
        'get-credentials',
        '${_CLUSTER_NAME}',
        '--zone=${_CLUSTER_ZONE}',
        '--project=$PROJECT_ID'
      ]

  # 4. Deploy to GKE using kubectl
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      [
        'set',
        'image',
        'deployment/${_SERVICE_NAME}',
        '${_SERVICE_NAME}=gcr.io/$PROJECT_ID/${_SERVICE_NAME}'
      ]

options:
  logging: CLOUD_LOGGING_ONLY
